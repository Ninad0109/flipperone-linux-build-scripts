name: Build Flipper One OS Pack

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:

jobs:
  build-ospack:
    runs-on: ubuntu-latest
    # Do NOT use `container:` here — we need the raw runner so /dev/kvm is accessible
    # and so build-ospack.sh hits Branch 1 (KVM path), not Branch 2 (docker/qemu path)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Enable KVM on the GitHub Actions runner.
      # ubuntu-latest runners expose /dev/kvm but the runner user needs group access.
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          # Verify — this must print a 'c' device line or the build will fall back to QEMU
          ls -la /dev/kvm
          [ -c /dev/kvm ] && [ -w /dev/kvm ] && echo "KVM: OK" || echo "KVM: NOT available (will use QEMU fallback)"

      - name: Configure apt for cross-architecture (arm64 → ports.ubuntu.com)
        run: |
            # The github runner is amd64. Ubuntu's security/main mirrors don't serve arm64 —
            # those live on ports.ubuntu.com. We need to split sources so that:
            #   amd64  → security.ubuntu.com  (as normal)
            #   arm64  → ports.ubuntu.com     (the only place arm64 debs actually exist)
        
            # 1. Rewrite the existing sources to be amd64-only
            sudo sed -i 's/^deb /deb [arch=amd64] /' /etc/apt/sources.list
            # Handle the newer deb822 format used on ubuntu-latest (noble) runners
            if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
              sudo sed -i 's/^Architectures:.*/Architectures: amd64/' \
                /etc/apt/sources.list.d/ubuntu.sources
            fi
        
            # 2. Add ports.ubuntu.com as the arm64 source for all four pockets
            cat <<'EOF' | sudo tee /etc/apt/sources.list.d/arm64-ports.list
            deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports noble           main restricted universe multiverse
            deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports noble-updates   main restricted universe multiverse
            deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports noble-backports main restricted universe multiverse
            deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports noble-security  main restricted universe multiverse
            EOF

            sudo apt-get update -y
      # Install system prerequisites that the Dockerfile also installs
      - name: Install build prerequisites
        run: |
          sudo dpkg --add-architecture arm64
          sudo apt-get update -y
          sudo apt-get install -y \
            git build-essential crossbuild-essential-arm64 \
            bison flex parted fdisk \
            python3-dev python3-libfdt python3-setuptools \
            swig libssl-dev gnutls-dev python3-pyelftools \
            qemu-user-binfmt \
            bc imagemagick libdw-dev libelf-dev debhelper \
            device-tree-compiler libssl-dev:arm64 rsync wget \
            mmdebstrap systemd-container systemd-resolved \
            pipx pigz cargo golang \
            libglib2.0-dev libostree-dev fakemachine

      # Install debos from source (same as Dockerfile does).
      # Key: install to /usr/local/bin so it's in sudo's secure_path AND in plain PATH.
      # This avoids the entire sudo/PATH conflict.
      - name: Install debos
        run: |
          export GOPATH="$HOME/go"
          go install -v github.com/go-debos/debos/cmd/debos@latest
          sudo install -m 755 "$HOME/go/bin/debos" /usr/local/bin/debos
          # Verify it's found and report version
          debos --help | head -3 || true
          sudo debos --help | head -3 || true

      # Install zeekstd (needed by build-images.sh, not ospack — but install it anyway)
      - name: Install zeekstd
        run: |
          cargo install --git https://github.com/rorosen/zeekstd.git zeekstd_cli
          sudo install -m 755 ~/.cargo/bin/zeekstd /usr/local/bin/zeekstd

      # Install bmaptool
      - name: Install bmaptool
        run: |
          pipx install --global \
            git+https://github.com/flipperdevices/bmaptool.git@flipper-devel

      # THE KEY STEP: run build-ospack.sh directly on the runner (not inside a container).
      # Because /.dockerenv does NOT exist on the runner and /dev/kvm DOES exist,
      # the script will take Branch 1: `debos -c $(nproc) -m 6Gb` — the fast KVM path.
      - name: Build OS pack
        run: |
          mkdir -p out
          # Confirm which branch the script will take before actually running
          if [ -c /dev/kvm ] && [ -w /dev/kvm ]; then
            echo ">>> Will use KVM-accelerated debos (fast path)"
          elif [ -f /.dockerenv ]; then
            echo ">>> WARNING: inside Docker, will use QEMU (slow path)"
          elif [ "$(id -u)" -eq 0 ]; then
            echo ">>> Will use root fakemachine path"
          else
            echo ">>> Will use sudo --disable-fakemachine path"
          fi
          IMG_OUT=out ./build-ospack.sh
        timeout-minutes: 120  # ospack with KVM should finish in ~30-60 min; set ceiling

      - name: Upload OS pack artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: flipper-ospack-${{ github.sha }}
          path: out/
          retention-days: 7
