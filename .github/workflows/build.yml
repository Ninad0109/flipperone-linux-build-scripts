name: Build Flipper One OS
on: [workflow_dispatch]
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y debos golang-go libostree-dev qemu-user-static qemu-system-arm qemu-kvm systemd-container debootstrap
          go install github.com/go-debos/debos/cmd/debos@latest
          sudo cp $HOME/go/bin/debos /usr/local/bin/

      - name: Build The Image
        run: |
          mkdir -p out
          ./build-ospack.sh

      - name: Save The Finished File
        uses: actions/upload-artifact@v4
        with:
          name: flipper-one-image
          path: out/
