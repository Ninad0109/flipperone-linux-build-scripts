name: Build Flipper One OS Pack

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:

jobs:
  build-ospack:
    runs-on: ubuntu-latest
    # Do NOT use `container:` here — we need the raw runner so /dev/kvm is accessible
    # and so build-ospack.sh hits Branch 1 (KVM path), not Branch 2 (docker/qemu path)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Enable KVM on the GitHub Actions runner.
      # ubuntu-latest runners expose /dev/kvm but the runner user needs group access.
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          # Verify — this must print a 'c' device line or the build will fall back to QEMU
          ls -la /dev/kvm
          [ -c /dev/kvm ] && [ -w /dev/kvm ] && echo "KVM: OK" || echo "KVM: NOT available (will use QEMU fallback)"
      - name: Fix kernel file permissions for fakemachine/debos
        run: |
          # fakemachine reads the host kernel to boot its internal QEMU VM.
          # Ubuntu packages vmlinuz as 0600 (root-only) by default.
          # Make all kernels and initrds in /boot world-readable.
          sudo chmod 0644 /boot/vmlinuz-* 2>/dev/null || true
          sudo chmod 0644 /boot/initrd.img-* 2>/dev/null || true
      
          # Verify
          ls -la /boot/vmlinuz-* /boot/initrd.img-* 2>/dev/null \
            | awk '{print $1, $NF}'
      - name: Configure apt sources (amd64 = mirrors, arm64 = ports only)
        run: |
          sudo dpkg --add-architecture arm64
        
          # ubuntu.sources uses `mirror+file:` with no Architectures field,
          # so apt tries security.ubuntu.com for arm64 and gets 404s.
          # Inject Architectures: amd64 into BOTH stanzas in ubuntu.sources.
          # The file has two Types: deb blocks (main + security) — we need
          # to add the Architectures line to each one.
          sudo python3 - <<'PYEOF'
          import re
          
          path = "/etc/apt/sources.list.d/ubuntu.sources"
          with open(path, "r") as f:
              content = f.read()
          
          # Each stanza starts with "Types: deb".
          # Insert "Architectures: amd64" after the "Types: deb" line in every stanza.
          patched = re.sub(
              r"(Types: deb\n)",
              r"\1Architectures: amd64\n",
              content
          )
          
          with open(path, "w") as f:
              f.write(patched)
          
          print("Patched ubuntu.sources:")
          print(patched)
          PYEOF
        
          # Write the arm64 ports list (idempotent — overwrites if already exists)
          cat <<'EOF' | sudo tee /etc/apt/sources.list.d/arm64-ports.list
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports noble           main restricted universe multiverse
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports noble-updates   main restricted universe multiverse
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports noble-backports main restricted universe multiverse
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports noble-security  main restricted universe multiverse
          EOF
        
          # Also fix microsoft-prod.list — it lists arm64 but microsoft's repo
          # doesn't serve arm64 packages for all components, which can cause
          # warnings or errors. Restrict it to amd64 only.
          sudo sed -i 's/\[arch=amd64,arm64,armhf/[arch=amd64/' \
            /etc/apt/sources.list.d/microsoft-prod.list
        
          # Sanity check
          echo "=== ubuntu.sources after patch ==="
          cat /etc/apt/sources.list.d/ubuntu.sources
        
          sudo apt-get update -y
      - name: Debug apt sources
        run: |
          echo "=== /etc/apt/sources.list ==="
          cat /etc/apt/sources.list || echo "(empty or missing)"
          echo ""
          echo "=== /etc/apt/sources.list.d/ ==="
          ls -la /etc/apt/sources.list.d/
          echo ""
          echo "=== contents of each .list and .sources file ==="
          for f in /etc/apt/sources.list.d/*; do
            echo "--- $f ---"
            cat "$f"
            echo ""
          done
          echo "=== dpkg architectures ==="
          dpkg --print-architecture
          dpkg --print-foreign-architectures
      # Install system prerequisites that the Dockerfile also installs
      - name: Install build prerequisites
        run: |
          sudo dpkg --add-architecture arm64
          sudo apt-get update -y
          sudo apt-get install -y \
            git build-essential crossbuild-essential-arm64 \
            bison flex parted fdisk \
            python3-dev python3-libfdt python3-setuptools \
            swig libssl-dev gnutls-dev python3-pyelftools \
            qemu-user-binfmt \
            bc imagemagick libdw-dev libelf-dev debhelper \
            device-tree-compiler libssl-dev:arm64 rsync wget \
            mmdebstrap systemd-container systemd-resolved \
            pipx pigz cargo golang \
            libglib2.0-dev libostree-dev fakemachine

      # Install debos from source (same as Dockerfile does).
      # Key: install to /usr/local/bin so it's in sudo's secure_path AND in plain PATH.
      # This avoids the entire sudo/PATH conflict.
      - name: Install debos
        run: |
          export GOPATH="$HOME/go"
          go install -v github.com/go-debos/debos/cmd/debos@latest
          sudo install -m 755 "$HOME/go/bin/debos" /usr/local/bin/debos
          # Verify it's found and report version
          debos --help | head -3 || true
          sudo debos --help | head -3 || true

      # Install zeekstd (needed by build-images.sh, not ospack — but install it anyway)
      - name: Install zeekstd
        run: |
          cargo install --git https://github.com/rorosen/zeekstd.git zeekstd_cli
          sudo install -m 755 ~/.cargo/bin/zeekstd /usr/local/bin/zeekstd

      # Install bmaptool
      - name: Install bmaptool
        run: |
          pipx install --global \
            git+https://github.com/flipperdevices/bmaptool.git@flipper-devel

      - name: Install Debian archive keyring for mmdebstrap
        run: |
          # mmdebstrap runs inside fakemachine and bootstraps a Debian trixie chroot.
          # The fakemachine VM inherits /usr/share/keyrings from the host.
          # Without debian-archive-keyring on the host, apt inside the VM cannot
          # verify deb.debian.org or security.debian.org and refuses to proceed.
      
          # The package lives in Ubuntu's universe component (already enabled).
          sudo apt-get install -y debian-archive-keyring
      
          # Verify the keys are now present where mmdebstrap/apt will look for them
          ls -la /usr/share/keyrings/debian-archive-keyring.gpg
          ls -la /usr/share/keyrings/debian-archive-removed-keys.gpg
      
          # Cross-check that the specific missing key IDs are covered
          gpg --no-default-keyring \
              --keyring /usr/share/keyrings/debian-archive-keyring.gpg \
              --list-keys 2>/dev/null \
            | grep -E "6ED0E7B82643E131|78DBA3BC47EF2265|762F67A0B2C39DE4|BDE6D2B9216EC7A8|8E9F831205B4BA95" \
            && echo "All required Debian keys present" \
            || echo "WARNING: some keys still missing"
      # THE KEY STEP: run build-ospack.sh directly on the runner (not inside a container).
      # Because /.dockerenv does NOT exist on the runner and /dev/kvm DOES exist,
      # the script will take Branch 1: `debos -c $(nproc) -m 6Gb` — the fast KVM path.
      - name: Build OS pack
        run: |
          mkdir -p out
          # Confirm which branch the script will take before actually running
          if [ -c /dev/kvm ] && [ -w /dev/kvm ]; then
            echo ">>> Will use KVM-accelerated debos (fast path)"
          elif [ -f /.dockerenv ]; then
            echo ">>> WARNING: inside Docker, will use QEMU (slow path)"
          elif [ "$(id -u)" -eq 0 ]; then
            echo ">>> Will use root fakemachine path"
          else
            echo ">>> Will use sudo --disable-fakemachine path"
          fi
          IMG_OUT=out ./build-ospack.sh
        timeout-minutes: 120  # ospack with KVM should finish in ~30-60 min; set ceiling

      - name: Upload OS pack artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: flipper-ospack-${{ github.sha }}
          path: out/
          retention-days: 7
